<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — Alumni Portal</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#f1f5f9;min-height:100vh}
    .topbar{background:#1e293b;padding:14px 24px;display:flex;align-items:center;gap:16px}
    .topbar a{color:#94a3b8;font-size:13px;text-decoration:none}.topbar a:hover{color:#fff}
    .topbar .title{color:#fff;font-weight:600;font-size:15px}
    .badge-std{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
    .page{max-width:900px;margin:0 auto;padding:28px 20px}
    h1{font-size:22px;font-weight:700;color:#1e293b;margin-bottom:4px}
    .sub{font-size:13px;color:#64748b;margin-bottom:24px}
    .events-list{display:flex;flex-direction:column;gap:16px}
    .event-card{background:#fff;border-radius:14px;padding:22px 24px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;gap:18px;align-items:flex-start}
    .event-date-block{min-width:64px;text-align:center;border-radius:10px;padding:10px 8px;flex-shrink:0}
    .type-networking{background:#eff6ff}.type-workshop{background:#fef3c7}.type-reunion{background:#fdf2f8}.type-webinar{background:#f0fdf4}
    .eday{font-size:26px;font-weight:800;line-height:1}
    .emon{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .event-info{flex:1}
    .event-title{font-weight:700;font-size:15px;color:#1e293b;margin-bottom:4px}
    .event-host{font-size:12px;color:#6366f1;font-weight:500;margin-bottom:8px}
    .event-desc{font-size:13px;color:#475569;line-height:1.6;margin-bottom:12px}
    .event-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
    .meta-chip{font-size:11px;color:#64748b;display:flex;align-items:center;gap:4px}
    .type-chip-ev{font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;text-transform:capitalize}
    .tc-networking{background:#eff6ff;color:#1d4ed8}.tc-workshop{background:#fef3c7;color:#92400e}
    .tc-reunion{background:#fdf2f8;color:#9d174d}.tc-webinar{background:#f0fdf4;color:#166534}
    .reg-count{font-size:11px;color:#94a3b8}
    .reg-btn{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:12px;font-weight:700;cursor:pointer}
    .reg-btn:hover{background:#4f46e5}
    .reg-btn.registered{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;cursor:default}
    .loading{text-align:center;padding:40px;color:#94a3b8}
    .empty{text-align:center;padding:60px;color:#94a3b8}
    .empty h3{font-size:16px;color:#64748b;margin-bottom:8px}
  </style>
</head>
<body>
<div class="topbar">
  <a href="A1.html">← Dashboard</a>
  <span style="color:#475569">|</span>
  <span class="title">College Events</span>
  <span class="badge-std">⭐ Standard</span>
</div>

<div class="page">
  <h1>College Events</h1>
  <p class="sub">Browse and register for placement drives, workshops, networking meetups, and alumni reunions.</p>
  <div class="events-list" id="list"><div class="loading">Loading events...</div></div>
</div>

<script type="module">
  import { FeaturesAPI } from '../../api.js';

  const role = localStorage.getItem('userRole');
  const collegeId = localStorage.getItem('collegeId');
  const userId = +(localStorage.getItem('userId') || 0);
  if (!['alumni','candidate'].includes(role) || !collegeId) window.location.href = 'A1.html';

  let registeredIds = new Set();

  async function load() {
    const list = document.getElementById('list');
    try {
      const events = await FeaturesAPI.alumni.getEvents();
      if (!events || !events.length) {
        list.innerHTML = '<div class="empty"><h3>No upcoming events</h3><p>Check back soon for new events.</p></div>';
        return;
      }
      registeredIds = new Set(events.filter(e => e.registrations.includes(userId)).map(e => e.id));
      list.innerHTML = events.map(e => renderEvent(e)).join('');
    } catch(err) {
      const msg = err?.message || '';
      list.innerHTML = msg.includes('STANDARD') || msg.includes('403')
        ? '<div class="empty"><h3>🔒 Standard Plan Required</h3><p>College Events require the Standard plan.</p></div>'
        : `<div class="empty"><h3>Error</h3><p>${msg}</p></div>`;
    }
  }

  function renderEvent(e) {
    const d = new Date(e.date);
    const day = d.getDate();
    const mon = d.toLocaleString('default', { month: 'short' });
    const isReg = registeredIds.has(e.id);
    const regBtn = isReg
      ? `<button class="reg-btn registered">✓ Registered</button>`
      : `<button class="reg-btn" id="reg-${e.id}" onclick="register(${e.id})">Register</button>`;
    return `
      <div class="event-card">
        <div class="event-date-block type-${e.type}">
          <div class="eday">${day}</div>
          <div class="emon">${mon}</div>
        </div>
        <div class="event-info">
          <div class="event-title">${e.title}</div>
          <div class="event-host">By ${e.host}</div>
          <div class="event-desc">${e.description}</div>
          <div class="event-meta">
            <span class="meta-chip">🕐 ${e.time}</span>
            <span class="type-chip-ev tc-${e.type}">${e.type}</span>
            <span class="reg-count">👥 ${e.registrations.length} registered</span>
          </div>
          ${regBtn}
        </div>
      </div>`;
  }

  window.register = async (eventId) => {
    try {
      const result = await FeaturesAPI.alumni.registerEvent(eventId);
      if (result.success) {
        registeredIds.add(eventId);
        const btn = document.getElementById('reg-' + eventId);
        if (btn) { btn.className = 'reg-btn registered'; btn.textContent = '✓ Registered'; btn.onclick = null; }
      }
    } catch(err) { alert('Error: ' + (err?.message || '')); }
  };

  load();
</script>
</body>
</html>
