<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CareerNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="loginstyle.css">
    <style>
        /* Extra styles for the 2 admin cards that need distinct colours */
        .college-admin-icon { background: #0ea5e9; }
        .super-admin-icon   { background: #7c3aed; }

        /* Make the actor-tabs grid wrap nicely for 6 cards */
        .actor-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 560px;
            margin: 0 auto 28px auto;
        }

        /* Hint text under login box */
        .demo-hint {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            margin-top: 6px;
        }
    </style>
</head>

<body class="candidate-bg">

    <div class="main-wrapper">

        <!-- ── Role Selector Tabs ─────────────────────────────────── -->
        <div class="actor-tabs">

            <div class="actor-card active" data-role="candidate">
                <div class="icon-box candidate-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <p>Candidate</p>
            </div>

            <div class="actor-card" data-role="alumni">
                <div class="icon-box alumni-icon">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <p>Alumni</p>
            </div>

            <div class="actor-card" data-role="recruiter">
                <div class="icon-box recruiter-icon">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
                <p>Recruiter</p>
            </div>

            <div class="actor-card" data-role="officer">
                <div class="icon-box officer-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <p>Placement Officer</p>
            </div>

            <div class="actor-card" data-role="college_admin">
                <div class="icon-box college-admin-icon">
                    <i class="fa-solid fa-building-columns"></i>
                </div>
                <p>College Admin</p>
            </div>

            <div class="actor-card" data-role="super_admin">
                <div class="icon-box super-admin-icon">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <p>Super Admin</p>
            </div>

        </div>

        <!-- ── Login Form ─────────────────────────────────────────── -->
        <div class="login-container">
            <h1>Login</h1>

            <div class="input-group">
                <p class="label">Email ID</p>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <p class="label">Password</p>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password">
                    <span id="togglePassword">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
            </div>

            <button class="login-btn" onclick="login()">Login</button>

            <p id="msg-display"></p>

            <p class="demo-hint" id="demo-hint">
                Demo: c@gmail.com / 123
            </p>
        </div>

        <!-- ── Back To Home ───────────────────────────────────────── -->
        <div class="footer-action">
            <button class="home-btn" onclick="window.location.href='./index.html'">
                <i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i>Back To Home
            </button>
        </div>

    </div>

    <script src="loginscript.js"></script>
</body>

</html>
