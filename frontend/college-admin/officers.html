<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>College Admin — Placement Officers | CareerNest</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../super-admin/style.css" />
  <style>
    .sidebar { background: #0c4a6e; }
    .sidebar .brand p { color: #7dd3fc; }
    .sidebar nav a { color: #7dd3fc; }
    .sidebar nav a:hover, .sidebar nav a.active { background: rgba(14,165,233,.15); color: #fff; border-left-color: #0ea5e9; }
    .sidebar .signout { border-top-color: #0369a1; }
    .topbar .avatar { background: #0ea5e9; }
    .btn-primary { background: #0ea5e9; }
    .btn-primary:hover { background: #0284c7; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <h2><i class="fa-solid fa-building-columns" style="color:#7dd3fc;margin-right:6px"></i>CareerNest</h2>
    <p id="sidebar-college">College Admin</p>
  </div>
  <nav>
    <a href="index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="officers.html" class="active"><i class="fa-solid fa-shield-halved"></i> Placement Officers</a>
    <a href="students.html"><i class="fa-solid fa-graduation-cap"></i> Students</a>
  </nav>
  <div class="signout">
    <a href="../login.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <span class="title">Placement Officers</span>
    <div class="user-pill">
      <span id="topbar-name">College Admin</span>
      <div class="avatar" id="topbar-avatar">CA</div>
    </div>
  </header>

  <main class="content">
    <div class="section-header">
      <h2>Placement Officers — <span id="college-label">Your College</span></h2>
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="fa-solid fa-user-plus"></i> Add Officer
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" style="text-align:center;padding:32px;color:#94a3b8">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ── Add Officer Modal ──────────────────────────────────── -->
<div class="modal-backdrop" id="add-modal">
  <div class="modal">
    <h3><i class="fa-solid fa-shield-halved" style="color:#0ea5e9;margin-right:6px"></i>Add Placement Officer</h3>
    <div class="form-group"><label>Full Name *</label><input id="f-name" placeholder="Dr. Rajesh Nair" /></div>
    <div class="form-group"><label>Email *</label><input id="f-email" type="email" placeholder="rajesh@college.edu" /></div>
    <div class="form-group"><label>Department</label><input id="f-dept" placeholder="Training &amp; Placement Cell" /></div>
    <p style="font-size:11px;color:#94a3b8;margin-bottom:10px">Default password: <strong>123</strong></p>
    <p id="add-err" style="color:#ef4444;font-size:12px;min-height:16px"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addOfficer()">Add Officer</button>
    </div>
  </div>
</div>

<script type="module">
  import { api } from '../api.js';

  const role = localStorage.getItem('userRole');
  if (role !== 'college_admin') window.location.href = '../login.html';

  const name = localStorage.getItem('userName') || 'College Admin';
  const collegeId = localStorage.getItem('collegeId');

  document.getElementById('topbar-name').textContent = name;
  document.getElementById('topbar-avatar').textContent =
    name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

  // Load college name
  async function loadCollegeName() {
    if (!collegeId || collegeId === 'null') return;
    try {
      const college = await api.get(`/colleges/${collegeId}`, 'college_admin');
      document.getElementById('sidebar-college').textContent = college.name;
      document.getElementById('college-label').textContent = college.name;
    } catch (e) {}
  }

  async function loadOfficers() {
    const tbody = document.getElementById('tbody');
    try {
      const users = await api.get('/users?role=placement_officer', 'college_admin');
      const officers = users.filter(u => u.role === 'placement_officer');
      if (!officers.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty"><i class="fa-solid fa-shield-halved"></i><p>No placement officers found.</p></div></td></tr>';
        return;
      }
      tbody.innerHTML = officers.map(u => `
        <tr>
          <td>
            <div class="chip">
              <div class="av ca">${(u.avatar || u.name.slice(0,2)).toUpperCase()}</div>
              <div>
                <div style="font-weight:600">${u.name}</div>
                <div style="font-size:11px;color:#64748b">ID: ${u.id}</div>
              </div>
            </div>
          </td>
          <td style="font-size:13px">${u.email}</td>
          <td style="font-size:13px">${u.department || '—'}</td>
          <td><span class="badge ${u.status === 'active' ? 'badge-green' : 'badge-gray'}">${u.status || 'active'}</span></td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="removeOfficer(${u.id}, '${u.name.replace("'", "")}')">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="5" style="color:#ef4444;padding:24px">${e.message}</td></tr>`;
    }
  }

  window.openAddModal = () => {
    ['f-name','f-email','f-dept'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('add-err').textContent = '';
    document.getElementById('add-modal').classList.add('open');
  };
  window.closeAddModal = () => document.getElementById('add-modal').classList.remove('open');

  window.addOfficer = async () => {
    const errEl = document.getElementById('add-err');
    const oName = document.getElementById('f-name').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const dept = document.getElementById('f-dept').value.trim();
    if (!oName || !email) { errEl.textContent = 'Name and email are required.'; return; }
    try {
      await api.post('/users', 'college_admin', {
        name: oName, email, role: 'placement_officer',
        collegeId: collegeId ? +collegeId : undefined,
        department: dept || undefined,
        status: 'active',
      });
      closeAddModal();
      loadOfficers();
    } catch (e) { errEl.textContent = e.message; }
  };

  window.removeOfficer = async (id, uname) => {
    if (!confirm(`Remove placement officer "${uname}"?`)) return;
    try {
      await api.delete(`/users/${id}`, 'college_admin');
      loadOfficers();
    } catch (e) { alert(e.message); }
  };

  window.logout = () => { localStorage.clear(); window.location.href = '../login.html'; };

  loadCollegeName();
  loadOfficers();
</script>
</body>
</html>
