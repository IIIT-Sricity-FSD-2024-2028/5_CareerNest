<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Super Admin — College Admins | CareerNest</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <h2><i class="fa-solid fa-crown" style="color:#a78bfa;margin-right:6px"></i>CareerNest</h2>
    <p>Super Admin Portal</p>
  </div>
  <nav>
    <a href="index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="colleges.html"><i class="fa-solid fa-building-columns"></i> Colleges</a>
    <a href="college-admin.html" class="active"><i class="fa-solid fa-user-shield"></i> College Admins</a>
  </nav>
  <div class="signout">
    <a href="../login.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <span class="title" id="page-title">College Admin Management</span>
    <div class="user-pill">
      <span id="topbar-name">Super Admin</span>
      <div class="avatar" id="topbar-avatar">SA</div>
    </div>
  </header>

  <main class="content">
    <!-- College selector when no query param -->
    <div id="college-selector" style="display:none;margin-bottom:20px">
      <div class="section-header"><h2>Select a College</h2></div>
      <div id="college-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px"></div>
    </div>

    <!-- Admin management panel -->
    <div id="admin-panel" style="display:none">
      <div style="margin-bottom:12px">
        <a href="college-admin.html" class="btn btn-outline btn-sm">
          <i class="fa-solid fa-arrow-left"></i> All Colleges
        </a>
      </div>

      <div class="section-header">
        <h2 id="college-heading">College Admin</h2>
        <button class="btn btn-primary btn-sm" id="assign-btn" onclick="openAssignModal()">
          <i class="fa-solid fa-user-plus"></i> Assign Admin
        </button>
      </div>

      <!-- Current admin card -->
      <div id="admin-card" style="margin-bottom:24px"></div>

      <!-- College stats -->
      <div class="stats-grid" id="college-stats" style="margin-bottom:24px"></div>
    </div>
  </main>
</div>

<!-- ── Assign Admin Modal ─────────────────────────────────── -->
<div class="modal-backdrop" id="assign-modal">
  <div class="modal">
    <h3><i class="fa-solid fa-user-plus" style="color:#7c3aed;margin-right:6px"></i>Assign College Admin</h3>
    <div class="form-group"><label>Full Name *</label><input id="a-name" placeholder="Dr. Ganesh Kumar" /></div>
    <div class="form-group"><label>Email *</label><input id="a-email" type="email" placeholder="admin@college.ac.in" /></div>
    <div class="form-group"><label>Password</label><input id="a-pass" type="password" placeholder="Leave blank for default (123)" /></div>
    <p style="font-size:11px;color:#94a3b8;margin-top:-8px;margin-bottom:10px">
      Default password is <strong>123</strong>. The admin can change it after first login.
    </p>
    <p id="assign-err" style="color:#ef4444;font-size:12px;min-height:16px"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAssignModal()">Cancel</button>
      <button class="btn btn-primary" onclick="assignAdmin()">Assign Admin</button>
    </div>
  </div>
</div>

<script type="module">
  import { SuperAdminAPI } from '../api.js';

  const role = localStorage.getItem('userRole');
  if (role !== 'super_admin') window.location.href = '../login.html';

  const uname = localStorage.getItem('userName') || 'Super Admin';
  document.getElementById('topbar-name').textContent = uname;
  document.getElementById('topbar-avatar').textContent =
    uname.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

  const params = new URLSearchParams(window.location.search);
  const collegeId = params.get('collegeId') ? +params.get('collegeId') : null;
  const collegeName = params.get('collegeName') ? decodeURIComponent(params.get('collegeName')) : null;

  if (collegeId) {
    loadAdminPanel(collegeId, collegeName);
  } else {
    loadCollegeSelector();
  }

  async function loadCollegeSelector() {
    document.getElementById('college-selector').style.display = 'block';
    const cards = document.getElementById('college-cards');
    try {
      const colleges = await SuperAdminAPI.getAllColleges();
      cards.innerHTML = colleges.map(c => `
        <a href="college-admin.html?collegeId=${c.id}&collegeName=${encodeURIComponent(c.name)}"
           style="text-decoration:none">
          <div style="background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;border:2px solid transparent;transition:.15s" 
               onmouseover="this.style.borderColor='#7c3aed'" onmouseout="this.style.borderColor='transparent'">
            <div style="font-size:22px;font-weight:700;color:#7c3aed;margin-bottom:6px">${c.name.slice(0,2).toUpperCase()}</div>
            <div style="font-weight:600;color:#1e293b">${c.name}</div>
            <div style="font-size:12px;color:#64748b;margin-top:4px">${c.admin ? `Admin: ${c.admin.name}` : '⚠️ No admin assigned'}</div>
            <div style="margin-top:8px">
              <span class="badge ${c.status === 'active' ? 'badge-green' : 'badge-red'}">${c.status}</span>
            </div>
          </div>
        </a>
      `).join('');
    } catch (e) {
      cards.innerHTML = `<p style="color:#ef4444">${e.message}</p>`;
    }
  }

  async function loadAdminPanel(cId, cName) {
    document.getElementById('admin-panel').style.display = 'block';
    document.getElementById('college-heading').textContent = cName ? `Admin — ${cName}` : `Admin — College #${cId}`;
    document.getElementById('page-title').textContent = cName || 'College Admin';

    await refreshAdmin(cId);
    await loadCollegeStats(cId);
  }

  async function refreshAdmin(cId) {
    const card = document.getElementById('admin-card');
    try {
      const college = await SuperAdminAPI.getCollege(cId);
      const admin = college.admin;
      if (!admin) {
        card.innerHTML = `
          <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:20px;display:flex;align-items:center;gap:12px">
            <i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b;font-size:20px"></i>
            <div>
              <div style="font-weight:600;color:#92400e">No College Admin Assigned</div>
              <div style="font-size:12px;color:#b45309;margin-top:2px">Click "Assign Admin" to create one.</div>
            </div>
          </div>`;
        return;
      }
      card.innerHTML = `
        <div style="background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div class="chip">
            <div class="av ca" style="width:46px;height:46px;font-size:16px">${admin.avatar || (admin.name.slice(0,2).toUpperCase())}</div>
            <div>
              <div style="font-weight:700;font-size:15px">${admin.name}</div>
              <div style="font-size:12px;color:#64748b">${admin.email}</div>
              <div style="margin-top:4px">
                <span class="badge ${admin.status === 'active' ? 'badge-green' : 'badge-yellow'}">${admin.status}</span>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-outline btn-sm" onclick="toggleStatus(${cId}, '${admin.status}')">
              ${admin.status === 'active' ? '<i class="fa-solid fa-ban"></i> Deactivate' : '<i class="fa-solid fa-check"></i> Activate'}
            </button>
            <button class="btn btn-primary btn-sm" onclick="openAssignModal()">
              <i class="fa-solid fa-user-pen"></i> Replace Admin
            </button>
          </div>
        </div>`;
    } catch (e) {
      card.innerHTML = `<p style="color:#ef4444">${e.message}</p>`;
    }
  }

  async function loadCollegeStats(cId) {
    const grid = document.getElementById('college-stats');
    try {
      const c = await SuperAdminAPI.getCollege(cId);
      const s = c.stats || {};
      grid.innerHTML = `
        <div class="stat-card ca-accent"><span class="label">Students</span><span class="value">${s.students ?? 0}</span></div>
        <div class="stat-card"><span class="label">Placement Officers</span><span class="value">${s.placementOfficers ?? 0}</span></div>
        <div class="stat-card"><span class="label">Alumni</span><span class="value">${s.alumni ?? 0}</span></div>
        <div class="stat-card"><span class="label">Recruiters</span><span class="value">${s.recruiters ?? 0}</span></div>
        <div class="stat-card ca-accent"><span class="label">Placed</span><span class="value">${s.placed ?? 0}</span></div>
      `;
    } catch (e) { console.error(e); }
  }

  window.openAssignModal = () => {
    ['a-name','a-email','a-pass'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('assign-err').textContent = '';
    document.getElementById('assign-modal').classList.add('open');
  };
  window.closeAssignModal = () => document.getElementById('assign-modal').classList.remove('open');

  window.assignAdmin = async () => {
    const errEl = document.getElementById('assign-err');
    const name = document.getElementById('a-name').value.trim();
    const email = document.getElementById('a-email').value.trim();
    const pass = document.getElementById('a-pass').value.trim();
    if (!name || !email) { errEl.textContent = 'Name and email are required.'; return; }
    try {
      await SuperAdminAPI.createCollegeAdmin(collegeId, { name, email, password: pass || undefined });
      closeAssignModal();
      refreshAdmin(collegeId);
    } catch (e) { errEl.textContent = e.message; }
  };

  window.toggleStatus = async (cId, currentStatus) => {
    const newStatus = currentStatus === 'active' ? 'inactive' : 'active';
    try {
      await SuperAdminAPI.toggleAdminStatus(cId, newStatus);
      refreshAdmin(cId);
    } catch (e) { alert(e.message); }
  };

  window.logout = () => { localStorage.clear(); window.location.href = '../login.html'; };
</script>
</body>
</html>
