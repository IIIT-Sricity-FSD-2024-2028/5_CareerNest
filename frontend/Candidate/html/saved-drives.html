<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Drives — CareerNest</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Boxicons -->
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="../Css/style.css">
  <style>
    /* ===== Saved Drives Page Styles ===== */
    .drives-list { display: flex; flex-direction: column; gap: 14px; }

    .drive-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .drive-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(57,52,160,0.15);
    }

    .drive-icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: var(--blue-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .drive-info { flex: 1; }
    .drive-title { font-weight: 700; font-size: 15px; color: var(--text-primary); margin-bottom: 4px; }
    .drive-company { font-size: 13px; color: var(--brand-primary); font-weight: 600; margin-bottom: 8px; }
    .drive-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag { font-size: 11px; padding: 4px 10px; border-radius: var(--radius-full); font-weight: 600; }
    .tag-blue  { background: var(--blue-light);   color: var(--blue-dark); }
    .tag-green { background: var(--green-light);  color: var(--green-dark); }
    .tag-orange{ background: #fef3c7;              color: #92400e; }
    .tag-gray  { background: #f1f5f9;              color: #475569; }

    .drive-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

    .btn-drive-apply {
      background: var(--brand-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-sans);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn-drive-apply:hover { background: var(--brand-secondary); box-shadow: 0 4px 12px rgba(57,52,160,0.2); }

    .btn-drive-remove {
      background: transparent;
      color: #ef4444;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-sans);
      transition: background 0.2s;
    }
    .btn-drive-remove:hover { background: #fef2f2; }

    .saved-date { font-size: 11px; color: #94a3b8; }

    .deadline-chip { font-size: 11px; padding: 3px 10px; border-radius: var(--radius-full); font-weight: 700; }
    .deadline-urgent { background: #fee2e2; color: #dc2626; }
    .deadline-ok     { background: var(--green-light); color: var(--green-dark); }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }
    .empty-state i {
      font-size: 48px;
      color: #cbd5e1;
      margin-bottom: 16px;
      display: block;
    }
    .empty-state h3 { font-size: 18px; color: var(--text-primary); margin-bottom: 8px; font-weight: 600; }
    .empty-state p  { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
    .empty-state a  {
      display: inline-block;
      background: var(--brand-primary);
      color: #fff;
      padding: 10px 24px;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .empty-state a:hover { background: var(--brand-secondary); }

    .loading-state { text-align: center; padding: 60px; color: var(--text-secondary); }
    .loading-state i { font-size: 32px; margin-bottom: 12px; display: block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      display: none;
      box-shadow: var(--shadow-lg);
    }

    .page-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      font-weight: 400;
    }
  </style>
</head>
<body>

<div class="app-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <i class='bx bxs-graduation'></i>
      </div>
      <div class="brand-text">
        <h2>CareerNest</h2>
        <p>College Placement Cell</p>
      </div>
    </div>

    <!-- User Profile Card -->
    <div class="sidebar-user-card" onclick="window.location.href='profile.html'" style="cursor: pointer;" title="View Profile">
      <div class="user-avatar" id="sidebar-avatar">SB</div>
      <div class="user-info">
        <h4 id="sidebar-name">Loading...</h4>
        <p id="sidebar-role">Student</p>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
      <ul>
        <li class="nav-item">
          <a href="index.html">
            <i class='bx bx-grid-alt'></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="opportunities.html">
            <i class='bx bx-briefcase-alt-2'></i>
            <span>Browse Opportunities</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="applications.html">
            <i class='bx bx-file-blank'></i>
            <span>My Applications</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="referrals.html">
            <i class='bx bx-user-plus'></i>
            <span>Referrals</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="changepassword.html">
            <i class='bx bx-lock-alt'></i>
            <span>Change Password</span>
          </a>
        </li>
        <!-- Tier-gated items injected by renderSidebarNav() from subscription.js -->
      </ul>
    </nav>

    <!-- Sign Out Footer -->
    <div class="sidebar-footer">
      <a href="../../login.html" class="sign-out">
        <i class='bx bx-log-out'></i>
        <span>Sign Out</span>
      </a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content page-enter">
    <!-- TOP HEADER -->
    <header class="top-header">
      <h1 class="page-title">Saved Drives</h1>
      <div class="header-actions">
        <div class="notification-container" style="position: relative;">
          <div class="notification-btn" id="notif-btn" style="cursor: pointer;">
            <i class='bx bx-bell'></i>
            <span class="badge red-badge" id="notif-count" style="display:none;">0</span>
          </div>
          <div class="notification-dropdown" id="notif-dropdown">
            <div class="notif-header">
              <h5>Notifications</h5>
              <a href="#" id="mark-read-btn">Mark all read</a>
            </div>
            <div class="notif-body" id="notif-list-container"></div>
          </div>
        </div>
        <div class="top-avatar" id="top-avatar" onclick="window.location.href='profile.html'" style="cursor: pointer;" title="View Profile">SB</div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <div class="dashboard-scroll-area">
      <p class="page-subtitle">Drives you bookmarked — apply before the deadline!</p>
      <div id="list">
        <div class="loading-state">
          <i class='bx bx-loader-alt'></i>
          Loading saved drives...
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { FeaturesAPI } from '../../api.js';

  // ── Auth guard ──────────────────────────────────────────────────────────────
  const role      = localStorage.getItem('userRole');
  const collegeId = localStorage.getItem('collegeId');
  if (role !== 'candidate' || !collegeId) window.location.href = 'index.html';

  // ── Sidebar user info ───────────────────────────────────────────────────────
  const userName = localStorage.getItem('userName') || localStorage.getItem('userEmail') || 'Student';
  const initials = userName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  document.getElementById('sidebar-name').textContent = userName;
  document.getElementById('sidebar-avatar').textContent = initials;
  document.getElementById('top-avatar').textContent    = initials;

  // ── Load & render ───────────────────────────────────────────────────────────
  async function load() {
    const list = document.getElementById('list');
    try {
      const drives = await FeaturesAPI.candidate.getSavedDrives();
      if (!drives || !drives.length) {
        list.innerHTML = `
          <div class="empty-state">
            <i class='bx bx-bookmark-heart'></i>
            <h3>No saved drives yet</h3>
            <p>Use the Advanced Search to browse drives and bookmark the ones you're interested in.</p>
            <a href="advanced-search.html">Browse Drives →</a>
          </div>`;
        return;
      }
      list.innerHTML = `<div class="drives-list">${drives.map(d => renderCard(d)).join('')}</div>`;
    } catch(err) {
      const msg = err?.message || '';
      if (msg.includes('STANDARD') || msg.includes('403')) {
        list.innerHTML = `
          <div class="empty-state">
            <i class='bx bx-lock-alt'></i>
            <h3>Standard Plan Required</h3>
            <p>Saved Drives is available from the Standard plan. Contact your college admin to upgrade.</p>
          </div>`;
      } else {
        list.innerHTML = `
          <div class="empty-state">
            <i class='bx bx-error-circle'></i>
            <h3>Error loading drives</h3>
            <p>${msg}</p>
          </div>`;
      }
    }
  }

  function renderCard(d) {
    const isIntern   = d.type === 'internship';
    const pkgLabel   = isIntern ? `₹${(d.package/1000).toFixed(0)}K/mo stipend` : `${d.package} LPA`;
    const daysLeft   = Math.ceil((new Date(d.deadline) - new Date()) / 86400000);
    const deadlineCls= daysLeft < 5 ? 'deadline-urgent' : 'deadline-ok';
    return `
      <div class="drive-card" id="card-${d.id}">
        <div class="drive-icon">${isIntern ? '🎓' : '💼'}</div>
        <div class="drive-info">
          <div class="drive-title">${d.title}</div>
          <div class="drive-company">${d.company}</div>
          <div class="drive-tags">
            <span class="tag tag-green">💰 ${pkgLabel}</span>
            <span class="tag tag-blue">📍 ${d.location}</span>
            <span class="tag tag-gray">🎓 CGPA ≥ ${d.minCgpa}</span>
            <span class="deadline-chip ${deadlineCls}">⏰ ${daysLeft}d left</span>
          </div>
        </div>
        <div class="drive-actions">
          <button class="btn-drive-apply" onclick="applyDrive('${d.id}')">Apply Now</button>
          <button class="btn-drive-remove" onclick="removeSaved('${d.id}')">✕ Remove</button>
        </div>
      </div>`;
  }

  window.removeSaved = async (driveId) => {
    try {
      await FeaturesAPI.candidate.unsaveDrive(driveId);
      document.getElementById('card-' + driveId)?.remove();
      showToast('Removed from saved drives');
      if (!document.querySelector('.drive-card')) load();
    } catch(e) { showToast('Error: ' + (e?.message || '')); }
  };

  window.applyDrive = (driveId) => {
    showToast('Redirecting to application...');
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  load();
</script>

<!-- ── Subscription plan banner & sidebar nav injection ───────────────── -->
<script type="module">
  import { loadSubscription, renderPlanBanner, renderSidebarNav } from '../../subscription.js';
  const collegeId = localStorage.getItem('collegeId');
  const email     = localStorage.getItem('userEmail') || localStorage.getItem('userName') || '';
  if (collegeId && collegeId !== 'null') {
    const sub = await loadSubscription(collegeId, 'candidate');
    if (sub) {
      renderPlanBanner(sub, sub.collegeName, email);
      renderSidebarNav(sub, 'candidate');
    }
  }
</script>
</body>
</html>
