<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Drive Search — CareerNest</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#f1f5f9;min-height:100vh}
    .topbar{background:#1e293b;padding:14px 24px;display:flex;align-items:center;gap:16px}
    .topbar a{color:#94a3b8;font-size:13px;text-decoration:none}
    .topbar a:hover{color:#fff}
    .topbar .title{color:#fff;font-weight:600;font-size:15px}
    .page{max-width:1100px;margin:0 auto;padding:28px 20px}
    h1{font-size:22px;font-weight:700;color:#1e293b;margin-bottom:4px}
    .sub{font-size:13px;color:#64748b;margin-bottom:24px}
    .plan-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-left:10px}
    .badge-std{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .badge-prm{background:#faf5ff;color:#7c3aed;border:1px solid #ddd6fe}
    /* Filters */
    .filter-bar{background:#fff;border-radius:12px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px;border:1px solid #e2e8f0}
    .filter-group{display:flex;flex-direction:column;gap:5px}
    .filter-group label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
    .filter-group input, .filter-group select{border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;color:#1e293b;background:#f8fafc;outline:none;min-width:140px}
    .filter-group input:focus,.filter-group select:focus{border-color:#6366f1;background:#fff}
    .btn-search{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:600;cursor:pointer;margin-top:auto}
    .btn-search:hover{background:#4f46e5}
    .btn-clear{background:transparent;color:#64748b;border:1px solid #e2e8f0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;margin-top:auto}
    /* Results */
    .results-meta{font-size:13px;color:#64748b;margin-bottom:14px}
    .drives-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
    .drive-card{background:#fff;border-radius:12px;padding:20px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s}
    .drive-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
    .drive-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .drive-title{font-weight:700;font-size:15px;color:#1e293b}
    .drive-company{font-size:13px;color:#6366f1;font-weight:600}
    .type-chip{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
    .type-ft{background:#dcfce7;color:#166534}
    .type-int{background:#fef3c7;color:#92400e}
    .drive-meta{display:flex;flex-direction:column;gap:4px}
    .meta-row{display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b}
    .meta-row span{font-weight:500;color:#475569}
    .drive-footer{display:flex;gap:8px;margin-top:4px}
    .btn-apply{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;flex:1}
    .btn-save{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer}
    .btn-save.saved{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
    .btn-apply:hover{background:#4f46e5}
    .btn-save:hover{background:#e2e8f0}
    .dept-tags{display:flex;flex-wrap:wrap;gap:4px}
    .dept-tag{background:#f1f5f9;color:#475569;font-size:11px;padding:2px 8px;border-radius:20px}
    .empty{text-align:center;padding:60px 20px;color:#94a3b8}
    .empty h3{font-size:18px;margin-bottom:8px;color:#64748b}
    .loading{text-align:center;padding:40px;color:#94a3b8}
    .pkg{font-weight:700;color:#059669;font-size:14px}
    .deadline-warn{color:#dc2626}
    .toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:9999;animation:slideUp .3s ease;display:none}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
</head>
<body>
<div class="topbar">
  <a href="../html/index.html">← Dashboard</a>
  <span style="color:#475569">|</span>
  <span class="title">Advanced Drive Search</span>
  <span id="plan-badge" class="plan-badge badge-std" style="display:none"></span>
</div>

<div class="page">
  <h1>Search Placement Drives <span id="hd-badge"></span></h1>
  <p class="sub">Filter by company, type, package, and more. Save drives to apply later.</p>

  <div class="filter-bar">
    <div class="filter-group">
      <label>Search</label>
      <input id="q" type="text" placeholder="Company or role..." />
    </div>
    <div class="filter-group">
      <label>Type</label>
      <select id="type">
        <option value="">All Types</option>
        <option value="fulltime">Full-time</option>
        <option value="internship">Internship</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Sort By</label>
      <select id="sort">
        <option value="">Default</option>
        <option value="package_desc">Package (High → Low)</option>
        <option value="package_asc">Package (Low → High)</option>
        <option value="deadline">Deadline (Soonest)</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Min Package (LPA)</label>
      <input id="minPkg" type="number" placeholder="e.g. 8" min="0" step="0.5" />
    </div>
    <button class="btn-search" onclick="doSearch()">🔍 Search</button>
    <button class="btn-clear" onclick="clearFilters()">✕ Clear</button>
  </div>

  <div id="results-meta" class="results-meta"></div>
  <div id="drives-grid" class="drives-grid">
    <div class="loading">Loading drives...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { FeaturesAPI } from '../../api.js';
  import { loadSubscription, planBadgeHTML } from '../../subscription.js';

  const role = localStorage.getItem('userRole');
  const collegeId = localStorage.getItem('collegeId');
  if (role !== 'candidate' || !collegeId) { window.location.href = '../html/index.html'; }

  const sub = await loadSubscription(collegeId, 'candidate').catch(() => null);
  if (sub) {
    document.getElementById('plan-badge').style.display = 'inline-flex';
    document.getElementById('plan-badge').innerHTML = planBadgeHTML(sub);
    document.getElementById('hd-badge').innerHTML = planBadgeHTML(sub);
  }

  let savedIds = new Set();

  async function loadSavedIds() {
    try {
      const saved = await FeaturesAPI.candidate.getSavedDrives();
      savedIds = new Set((saved || []).map(d => d.id));
    } catch(e) {}
  }

  async function doSearch() {
    const q = document.getElementById('q').value.trim();
    const type = document.getElementById('type').value;
    const sort = document.getElementById('sort').value;
    const minPkg = document.getElementById('minPkg').value;

    const grid = document.getElementById('drives-grid');
    const meta = document.getElementById('results-meta');
    grid.innerHTML = '<div class="loading">Searching...</div>';

    try {
      const drives = await FeaturesAPI.candidate.searchDrives(q||undefined, type||undefined, sort||undefined, minPkg||undefined);
      meta.textContent = `${drives.length} drive${drives.length !== 1 ? 's' : ''} found`;
      if (!drives.length) {
        grid.innerHTML = '<div class="empty"><h3>No drives found</h3><p>Try adjusting your filters</p></div>';
        return;
      }
      grid.innerHTML = drives.map(d => renderDriveCard(d)).join('');
    } catch(err) {
      const msg = err?.message || 'Failed to load drives';
      meta.textContent = '';
      if (msg.includes('STANDARD') || msg.includes('403')) {
        grid.innerHTML = `<div class="empty"><h3>🔒 Standard Plan Required</h3><p>Advanced search is available from the Standard plan. Contact your college admin to upgrade.</p></div>`;
      } else {
        grid.innerHTML = `<div class="empty"><h3>Error</h3><p>${msg}</p></div>`;
      }
    }
  }

  function renderDriveCard(d) {
    const isSaved = savedIds.has(d.id);
    const isIntern = d.type === 'internship';
    const pkgLabel = isIntern ? `₹${(d.package/1000).toFixed(0)}K/mo` : `${d.package} LPA`;
    const daysLeft = Math.ceil((new Date(d.deadline) - new Date()) / 86400000);
    const deadlineClass = daysLeft < 5 ? 'deadline-warn' : '';
    return `
      <div class="drive-card" id="card-${d.id}">
        <div class="drive-head">
          <div>
            <div class="drive-title">${d.title}</div>
            <div class="drive-company">${d.company}</div>
          </div>
          <span class="type-chip ${isIntern ? 'type-int' : 'type-ft'}">${isIntern ? 'Internship' : 'Full-time'}</span>
        </div>
        <div class="drive-meta">
          <div class="meta-row">📦 Package: <span class="pkg">${pkgLabel}</span></div>
          <div class="meta-row">📅 Deadline: <span class="${deadlineClass}">${d.deadline} (${daysLeft}d left)</span></div>
          <div class="meta-row">📍 Location: <span>${d.location}</span></div>
          <div class="meta-row">🎓 Min CGPA: <span>${d.minCgpa}</span></div>
        </div>
        <div class="dept-tags">${(d.department||[]).map(dep => `<span class="dept-tag">${dep}</span>`).join('')}</div>
        <div class="drive-footer">
          <button class="btn-apply" onclick="applyDrive('${d.id}')">Apply Now</button>
          <button class="btn-save ${isSaved ? 'saved' : ''}" id="save-${d.id}" onclick="toggleSave('${d.id}', this)">${isSaved ? '🔖 Saved' : '🔖 Save'}</button>
        </div>
      </div>`;
  }

  window.toggleSave = async (driveId, btn) => {
    const isSaved = savedIds.has(driveId);
    try {
      if (isSaved) {
        await FeaturesAPI.candidate.unsaveDrive(driveId);
        savedIds.delete(driveId);
        btn.textContent = '🔖 Save';
        btn.classList.remove('saved');
        showToast('Drive removed from saved');
      } else {
        await FeaturesAPI.candidate.saveDrive(driveId);
        savedIds.add(driveId);
        btn.textContent = '🔖 Saved';
        btn.classList.add('saved');
        showToast('Drive saved! View in Saved Drives.');
      }
    } catch(e) { showToast('Error: ' + (e?.message || 'Something went wrong')); }
  };

  window.applyDrive = (driveId) => {
    showToast('Applying to drive... (Redirect to application form)');
  };

  window.doSearch = doSearch;
  window.clearFilters = () => {
    document.getElementById('q').value = '';
    document.getElementById('type').value = '';
    document.getElementById('sort').value = '';
    document.getElementById('minPkg').value = '';
    doSearch();
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  await loadSavedIds();
  doSearch();
</script>
</body>
</html>
